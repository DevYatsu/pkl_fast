[package]
name = "pkl-bindgen"
version = "0.1.1"
edition = "2021"
description = "Code generation and evaluation for Pkl configuration language"

[workspace]
resolver = "2"
members = [
    "crates/pkl_core",
    "crates/pkl_macros",
    "crates/pkl_codegen",
]

[dependencies]
pkl_core = { path = "crates/pkl_core" }
pkl_macros = { path = "crates/pkl_macros" }
pkl_codegen = { path = "crates/pkl_codegen" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[[bin]]
name = "pkl-bindgen"
path = "src/main.rs"
